name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build y pruebas (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [payments-service, notifications-service]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # Testcontainers usa el Docker que ya trae el runner de GitHub: PostgreSQL y RabbitMQ reales, no mocks.
      - name: Compilar y correr pruebas
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B verify

      - name: Subir reportes de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports

  docker-image:
    name: Imagen Docker y arranque con Compose
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Construir imágenes y levantar todo el stack (PostgreSQL, RabbitMQ, API, relay, notificaciones)
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: Comprobar /actuator/health de los dos servicios
        run: |
          curl --fail --silent --show-error http://localhost:8080/actuator/health
          curl --fail --silent --show-error http://localhost:8081/actuator/health

      - name: Prueba de humo de punta a punta (pago, outbox, RabbitMQ, notificación)
        run: ./scripts/smoke-test.sh

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down -v
