name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers usa el Docker que ya trae el runner de GitHub: PostgreSQL real, no un mock.
      - name: Compilar y correr pruebas
        run: ./mvnw -B verify

      - name: Subir reportes de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker-image:
    name: Imagen Docker y arranque con Compose
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen y levantar API + PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Comprobar /actuator/health
        run: curl --fail --silent --show-error http://localhost:8080/actuator/health

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down -v
